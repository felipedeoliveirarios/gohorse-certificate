<!doctype html>
<html lang="pt-BR" data-tema="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Go Horse certification. Português, Español, English, Français, Italiano.">
<title>Go Horse certification</title>
<style>
:root { color-scheme: light; }
:root[data-tema="dark"] { color-scheme: dark; }
body { text-align: center; margin: 0; background: white; color: black; }
[data-tema="dark"] body { background: #161616; color: #eee; }
[data-tema="dark"] a { color: #9fc5ff; }
#pagina { min-height: 100svh; display: flex; flex-direction: column; box-sizing: border-box; padding-bottom: 120px; }
header { padding: 88px 12px 0; }
#inicio, #prova, #resultado { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px 12px; }
[hidden] { display: none !important; }
#opcoes { display: inline-block; text-align: left; max-width: 100%; }
#opcoes label { display: block; margin-bottom: 12px; }
#logo { width: 160px; max-width: 100%; height: auto; }
[data-tema="dark"] #logo { filter: invert(1); }
#certificado { position: relative; box-sizing: border-box; container-type: inline-size; width: 100%; max-width: 1122px; aspect-ratio: 297 / 210; border: 1px solid; margin-top: 24px; background: white; color: black; color-scheme: light; }
#certificado > img { position: absolute; top: 5%; left: 5%; width: 10%; height: auto; }
#cert-conteudo { position: absolute; inset: 22% 12% 22%; display: flex; flex-direction: column; justify-content: center; gap: .8cqw; }
#cert-conteudo h2, #cert-conteudo h1, #cert-conteudo p { margin: 0; }
#cert-conteudo h2 { font-size: 1.5cqw; line-height: 1.2; }
#cert-conteudo h1 { font-size: 2.8cqw; line-height: 1.15; }
#cert-conteudo p { font-size: 1.5cqw; line-height: 1.35; }
#cert-conteudo #nomeCert { font-size: 3cqw; line-height: 1.15; overflow-wrap: anywhere; }
#cert-conteudo #dataCert { font-size: 1.2cqw; }
#validacao { position: absolute; bottom: 5%; right: 5%; width: 14%; font-size: 1.1cqw; line-height: 1.2; }
#validacao a { display: block; text-align: center; color: #0000ee; }
#validacao img { display: block; width: 100%; height: auto; }
#preferencias { position: absolute; top: 0; right: 0; display: flex; gap: 4px; padding: 6px; border: 1px solid #e2e8f0; border-top: 0; border-right: 0; border-radius: 0 0 0 14px; background: #f8fafc; color: #334155; box-shadow: 0 4px 18px #0f172a12; font: 13px system-ui, sans-serif; max-width: calc(100% - 32px); box-sizing: border-box; }
#preferencias label { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 36px; padding: 0 8px; cursor: pointer; border-radius: 8px; }
#preferencias svg { width: 20px; height: 20px; flex-shrink: 0; }
#preferencias label:hover { background: #e2e8f0; }
#tema-controle { position: relative; }
#tema { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
#trilho { display: inline-block; width: 38px; height: 22px; border-radius: 20px; background: #94a3b8; pointer-events: none; }
#trilho::after { content: ''; display: block; width: 18px; height: 18px; margin: 2px; border-radius: 50%; background: white; box-shadow: 0 1px 3px #0003; }
#tema:checked + #trilho { background: #2563eb; }
#tema:checked + #trilho::after { transform: translateX(16px); }
#tema:focus-visible + #trilho { outline: 2px solid #2563eb; outline-offset: 3px; }
#idioma-controle { position: relative; width: 36px; padding: 0 !important; }
#idioma { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
#idioma-controle:focus-within { outline: 2px solid #2563eb; outline-offset: 1px; }
#preferencias option { background: white; color: #334155; font: 13px system-ui, sans-serif; }
[data-tema="dark"] #preferencias { background: #1e293b; color: #e2e8f0; border-color: #475569; box-shadow: 0 4px 18px #0004; }
[data-tema="dark"] #preferencias label:hover { background: #334155; }
[data-tema="dark"] #preferencias option { background: #1e293b; color: #e2e8f0; }
#rodape { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px 16px; width: max-content; max-width: calc(100% - 24px); box-sizing: border-box; padding: 10px 16px; border: 1px solid #e2e8f0; border-bottom: 0; border-radius: 14px 14px 0 0; background: #f8fafc; color: #334155; font: 13px/1.5 system-ui, sans-serif; }
#rodape p { margin: 0; }
#kofi-widget > a { display: inline-block; padding: 8px 14px; border-radius: 7px; background: #808080; color: white; text-decoration: none; font-weight: 700; }
[data-tema="dark"] #rodape { background: #1e293b; color: #e2e8f0; border-color: #475569; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media print {
  #preferencias, header, #inicio, #prova, #resultado > h1, #resultado > p, .controles, footer, noscript { display: none !important; }
  body { background: white !important; color: black !important; color-scheme: light; }
  #pagina, #resultado { display: block; min-height: auto; padding: 0; }
  #certificado { break-inside: avoid; width: 297mm; height: 210mm; max-width: none; aspect-ratio: auto; margin: 0; border: 0; print-color-adjust: exact; }
  @page { size: A4 landscape; margin: 0; }
}
</style>
</head>

const corretas = [1, 2, 0, 1, 2, 0, 1, 0, 2, 1];

let atual = 0, acertos = 0, resposta = null, etapa = 'inicio', dataCertificado = null;
const inicio = document.getElementById('inicio');
const prova = document.getElementById('prova');
const resultado = document.getElementById('resultado');
const idiomaSelect = document.getElementById('idioma');
const temaSwitch = document.getElementById('tema');
const nome = document.getElementById('nome');

function lerPreferencia(chave) {
 try { return localStorage.getItem(chave); } catch { return null; }
}
function salvarPreferencia(chave, valor) {
 try { localStorage.setItem(chave, valor); } catch { /* Sem storage, segue a prova. */ }
}
const idiomasNavegador = navigator.languages || [navigator.language || 'en'];
const detectado = idiomasNavegador.map(l => l.split('-')[0].toLowerCase()).find(l => Object.hasOwn(textos, l)) || 'en';
let idioma = lerPreferencia('gohorse-idioma');
if (!Object.hasOwn(textos, idioma)) idioma = detectado;
let tema = lerPreferencia('gohorse-tema');
if (tema !== 'light' && tema !== 'dark') tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
document.documentElement.dataset.tema = tema;
temaSwitch.checked = tema === 'dark';

function mostrar(focar = true) {
 const questao = textos[idioma].questions[atual];
 document.getElementById('numero').textContent = (atual + 1) + ' / ' + corretas.length;
 const pergunta = document.getElementById('pergunta');
 pergunta.textContent = questao[0];
 const opcoes = document.getElementById('opcoes');
 opcoes.replaceChildren();
 questao[1].forEach((texto, i) => {
  const label = document.createElement('label');
  const radio = document.createElement('input');
  radio.type = 'radio'; radio.name = 'resposta'; radio.value = i; radio.required = true;
  radio.checked = resposta === i;
  radio.onchange = () => {
   resposta = i;
   document.querySelectorAll('input[name="resposta"]').forEach(r => r.setCustomValidity(''));
  };
  radio.oninvalid = () => radio.setCustomValidity(textos[idioma].choose);
  label.append(radio, document.createTextNode(' ' + texto));
  opcoes.append(label);
 });
 if (focar) pergunta.focus();
}

function mostrarResultado() {
 const t = textos[idioma], passou = acertos >= 5;
 document.getElementById('tituloResultado').textContent = passou ? t.congrats : t.failed;
 document.getElementById('placar').textContent = t.score.replace('{score}', acertos).replace('{total}', corretas.length) + ' ' + (passou ? t.success : t.failure);
 document.getElementById('emissao').hidden = !passou;
}

function traduzir() {
 const t = textos[idioma];
 document.documentElement.lang = t.locale;
 document.title = t.title;
 idiomaSelect.value = idioma;
 document.querySelectorAll('[data-text]').forEach(el => el.textContent = t[el.dataset.text]);
 document.querySelectorAll('[data-alt]').forEach(el => el.alt = t[el.dataset.alt]);
 document.querySelectorAll('[data-label]').forEach(el => el.setAttribute('aria-label', t[el.dataset.label]));
 document.getElementById('idioma-controle').title = t.language;
 document.getElementById('tema-controle').title = t.theme;
 nome.placeholder = t.placeholder;
 nome.setCustomValidity('');
 if (etapa === 'prova') mostrar(false);
 if (etapa === 'resultado') mostrarResultado();
 if (dataCertificado) document.getElementById('dataCert').textContent = dataCertificado.toLocaleDateString(t.locale);
}

idiomaSelect.onchange = () => {
 idioma = idiomaSelect.value;
 salvarPreferencia('gohorse-idioma', idioma);
 traduzir();
};
temaSwitch.onchange = () => {
 tema = temaSwitch.checked ? 'dark' : 'light';
 document.documentElement.dataset.tema = tema;
 salvarPreferencia('gohorse-tema', tema);
};

document.getElementById('comecar').onclick = () => {
 etapa = 'prova'; inicio.hidden = true; prova.hidden = false; mostrar();
};
document.getElementById('respostas').onsubmit = e => {
 e.preventDefault();
 if (resposta === null || etapa !== 'prova') return;
 if (resposta === corretas[atual]) acertos++;
 atual++; resposta = null;
 if (atual < corretas.length) mostrar();
 else {
  etapa = 'resultado'; prova.hidden = true; resultado.hidden = false;
  mostrarResultado(); document.getElementById('tituloResultado').focus();
 }
};
nome.oninvalid = () => nome.setCustomValidity(textos[idioma].enterName);
nome.oninput = () => nome.setCustomValidity('');
document.getElementById('emissao').onsubmit = e => {
 e.preventDefault();
 if (etapa !== 'resultado' || acertos < 5) return;
 if (!nome.value.trim()) {
  nome.setCustomValidity(textos[idioma].enterName); nome.reportValidity(); return;
 }
 nome.setCustomValidity('');
 document.getElementById('nomeCert').textContent = nome.value.trim();
 dataCertificado = new Date();
 document.getElementById('dataCert').textContent = dataCertificado.toLocaleDateString(textos[idioma].locale);
 document.getElementById('certificado').hidden = false;
 document.getElementById('baixar').hidden = false;
 document.getElementById('certificado').scrollIntoView({behavior:'smooth'});
};
document.getElementById('baixar').onclick = () => window.print();
document.getElementById('recomecar').onclick = () => {
 atual = 0; acertos = 0; resposta = null; dataCertificado = null; etapa = 'prova';
 resultado.hidden = true; prova.hidden = false;
 document.getElementById('certificado').hidden = true;
 document.getElementById('baixar').hidden = true;
 mostrar();
};
traduzir();
</script>
